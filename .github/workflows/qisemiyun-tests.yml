name: Qisemi collector tests

on:
  push:
    paths:
      - 'tools/qisemiyun/**'
      - '.github/workflows/qisemiyun-tests.yml'
  pull_request:
    paths:
      - 'tools/qisemiyun/**'
      - '.github/workflows/qisemiyun-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/qisemiyun
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/qisemiyun/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python run.py doctor
      - run: python run.py run --scope full --dry-run
